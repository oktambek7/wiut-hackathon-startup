<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolisDiff AI</title>
<meta name="description" content="Evidence screening of Uzbek OSAGO offers: quotes, PDF pages and dated legal references.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007F73'/%3E%3Cpath d='M9 9h8a5 5 0 0 1 0 10h-4v4H9z M13 13v2h4a1 1 0 0 0 0-2z' fill='white' fill-rule='evenodd'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="wrap bar">
    <div class="brand"><span class="logo" aria-hidden="true">P</span><span>PolisDiff&nbsp;AI</span><span class="chip" id="chip-demo">Demo</span></div>
    <label class="lang"><span class="sr" id="lang-label">Language</span>
      <select id="lang" aria-labelledby="lang-label"></select></label>
  </div>
</header>

<main id="main" class="wrap">
  <section class="hero">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <p class="muted small" id="scope"></p>
  </section>

  <section class="card" aria-labelledby="step1">
    <h2 id="step1"></h2>
    <div class="grid2">
      <div>
        <div id="drop" class="drop" tabindex="0" role="button" aria-describedby="drop-hint">
          <input id="file" type="file" accept="application/pdf,.pdf" hidden>
          <span class="drop-icon" aria-hidden="true">⇪</span>
          <strong id="drop-label"></strong>
          <span id="drop-file" class="file-name"></span>
        </div>
        <p class="muted small" id="drop-hint"></p>
        <div class="samples">
          <p class="small"><strong id="samples-title"></strong> <span class="muted" id="samples-note"></span></p>
          <div id="sample-list" class="chips"></div>
        </div>
      </div>
      <div class="dates">
        <p><strong id="date-title"></strong></p>
        <p class="muted small" id="date-help"></p>
        <label class="check"><input type="checkbox" id="date-confirm"><span id="date-confirm-label"></span></label>
        <label class="field"><span id="applicable-label"></span><input type="date" id="applicable" disabled></label>
        <label class="field"><span id="audit-label"></span><input type="date" id="audit"></label>
        <p class="muted small" id="audit-help"></p>
      </div>
    </div>
    <details class="advanced">
      <summary id="adv-title"></summary>
      <fieldset><legend id="mode-legend"></legend><div id="modes" class="radios"></div></fieldset>
      <p class="muted small" id="mode-help"></p>
    </details>
    <div id="readiness" class="notice warn" hidden></div>
    <div class="actions">
      <button id="analyze" class="btn primary" disabled></button>
      <button id="clear" class="btn ghost"></button>
    </div>
    <p id="busy" class="busy" role="status" aria-live="polite" hidden></p>
    <div id="error" class="notice err" role="alert" hidden></div>
  </section>

  <section id="results" hidden aria-live="polite">
    <div class="card summary">
      <p id="summary-text" class="summary-text"></p>
      <p class="muted small" id="summary-meta"></p>
      <div id="metrics" class="metrics"></div>
      <div id="result-warnings"></div>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="tab-results" class="tabpanel" role="tabpanel"></div>
    <div id="tab-pages" class="tabpanel" role="tabpanel" hidden></div>
    <div id="tab-review" class="tabpanel" role="tabpanel" hidden></div>
    <div id="tab-sources" class="tabpanel" role="tabpanel" hidden></div>
  </section>
</main>

<footer class="foot">
  <div class="wrap small muted">
    <p id="foot-trust"></p>
    <p id="foot-legal"></p>
    <p><span id="foot-version"></span> · <a href="https://github.com/SardorEssketi/wiut_hackathon_nirvana" rel="noreferrer">Repository</a></p>
  </div>
</footer>
<script src="/app.js"></script>
</body>
</html>
